<svg viewBox="0 0 900 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto"><defs><marker id="ah-d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker></defs><rect x="20" y="20" width="250" height="260" rx="8" fill="#fbfcfd" stroke="#eaeef2" stroke-width="1.2"/><text x="34" y="44" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">侧栏（root 作用域）</text><rect x="36" y="58" width="218" height="54" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="145" y="81.14" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">sidebar.panellist（list）</text><text x="145" y="97.14" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">图标 ＋ label（order 排序）</text><rect x="36" y="156" width="218" height="60" rx="6" fill="#e8f1fd" stroke="#0969da" stroke-width="1.2"/><text x="145" y="182.14" font-size="11.5" font-weight="400" fill="#0969da" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">main（keyed）</text><text x="145" y="198.14" font-size="11.5" font-weight="400" fill="#0969da" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">同 id 的整页本体</text><line x1="145" y1="112" x2="145" y2="154" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-d)"/><text x="152" y="138" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">selectPanel(id)</text><text x="34" y="250" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">两个 slot 缺一不可：只注册 panellist</text><text x="34" y="266" font-size="10.5" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">会得到一行点了就抛错的按钮。</text><rect x="340" y="40" width="240" height="84" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="460" y="70.068" font-size="11.3" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">lib\client.js</text><text x="460" y="86.068" font-size="11.3" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">window.__ModuleLoader__.load</text><text x="460" y="102.068" font-size="11.3" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">（两处 slots.inject）</text><line x1="580" y1="82" x2="616" y2="82" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-d)"/><rect x="620" y="40" width="260" height="84" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="750" y="78.068" font-size="11.3" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">remote.workspaceFiles.read(</text><text x="750" y="94.068" font-size="11.3" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">会话 id, 绝对路径, …）</text><line x1="750" y1="124" x2="750" y2="168" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-d)"/><rect x="620" y="170" width="260" height="96" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="750" y="206.068" font-size="11.3" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">_registry\*.json / domains.json</text><text x="750" y="222.068" font-size="11.3" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">PROJECT.md / 各页 .data.js</text><text x="750" y="238.068" font-size="11.3" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">（该服务对「读」不限工作区）</text><rect x="340" y="170" width="250" height="76" rx="6" fill="#fff8e5" stroke="#bf8700" stroke-width="1.2"/><text x="465" y="204.068" font-size="11.3" font-weight="400" fill="#7a5b00" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">G08＝A：现在只读</text><text x="465" y="220.068" font-size="11.3" font-weight="400" fill="#7a5b00" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">可写面板／新建项目表单留第二期</text><text x="20" y="306" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">重启口径：只改 client.js 不用重启（HMR 轮询入口产物）；往 profile 加新包名要不要重启——未实测。</text></svg>