<svg viewBox="0 0 900 440" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto"><defs><marker id="ah-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker></defs><rect x="20" y="12" width="268" height="46" rx="6" fill="#e8f1fd" stroke="#0969da" stroke-width="1.2"/><text x="154" y="39.32" font-size="12" font-weight="400" fill="#0969da" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">0 · 参数校验 ＋ 暂停闸 ＋ dryRun 短路</text><text x="306" y="40" font-size="11.6" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">dryRun＝一个写操作都不做，只汇报「将建什么、排什么任务」</text><line x1="154" y1="58" x2="154" y2="76" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-c)"/><rect x="20" y="78" width="268" height="46" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="154" y="105.32" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">1 · 建目录骨架</text><text x="306" y="106" font-size="11.6" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">kind=skeleton-only 时连 PROJECT.md 都不建；失败不自动删已建目录</text><line x1="154" y1="124" x2="154" y2="142" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-c)"/><rect x="20" y="144" width="268" height="46" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="154" y="171.32" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">2 · 建 1 个项目主会话</text><text x="306" y="172" font-size="11.6" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">标题 / 权限档 / 模型 / 置顶沿用 create_domain_session 的现成实现</text><line x1="154" y1="190" x2="154" y2="208" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-c)"/><rect x="20" y="210" width="268" height="46" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="154" y="237.32" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">3 · 渲染角色任务书 → 排成首条消息</text><text x="306" y="238" font-size="11.6" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">roles 目录缺文件就报 missing-role-template，绝不现编</text><line x1="154" y1="256" x2="154" y2="274" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-c)"/><rect x="20" y="276" width="268" height="46" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="154" y="303.32" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">4 · 可选：写一条在任声明</text><text x="306" y="304" font-size="11.6" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">只能 declareNewOwner 指向新会话；冲突原样回报，不覆盖已有负责人</text><line x1="154" y1="322" x2="154" y2="340" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-c)"/><rect x="20" y="342" width="268" height="46" rx="6" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="154" y="369.32" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">5 · 回执</text><text x="306" y="370" font-size="11.6" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">created / cwd / sessionId / grouped（新目录必然未分组）/ nextSteps</text><text x="20" y="424" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">六阶里只有第 1～4 阶会写东西；任何一阶失败都停在那一阶并如实报 reason，不回滚已建目录。</text></svg>