<svg viewBox="0 0 900 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto"><defs><marker id="ah-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker></defs><rect x="20" y="80" width="120" height="76" rx="7" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="80" y="114.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">发送方</text><text x="80" y="130.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">会话</text><rect x="156" y="80" width="140" height="76" rx="7" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="226" y="106.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">① 解析目标</text><text x="226" y="122.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">声明优先</text><text x="226" y="138.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">索引兜底</text><rect x="312" y="80" width="140" height="76" rx="7" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="382" y="106.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">② 判在线</text><text x="382" y="122.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">有活 Agent</text><text x="382" y="138.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">才算在线</text><rect x="468" y="80" width="140" height="76" rx="7" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="538" y="106.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">③ 四级 OR 闸</text><text x="538" y="122.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">任一级按下</text><text x="538" y="138.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">即停</text><rect x="624" y="80" width="120" height="76" rx="7" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="684" y="114.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">④ 投递</text><text x="684" y="130.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">followup</text><rect x="760" y="80" width="120" height="76" rx="7" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="820" y="106.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">⑤ 必要时叫醒</text><text x="820" y="122.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">取不到接线</text><text x="820" y="138.248" font-size="11.8" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">就不拉</text><line x1="140" y1="118" x2="154" y2="118" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-b)"/><line x1="296" y1="118" x2="310" y2="118" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-b)"/><line x1="452" y1="118" x2="466" y2="118" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-b)"/><line x1="608" y1="118" x2="622" y2="118" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-b)"/><line x1="744" y1="118" x2="758" y2="118" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-b)"/><rect x="420" y="200" width="250" height="72" rx="7" fill="#fff8e5" stroke="#bf8700" stroke-width="1.2"/><text x="545" y="224.14" font-size="11.5" font-weight="400" fill="#7a5b00" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">被任一级按下 ⇒ 落盘入队</text><text x="545" y="240.14" font-size="11.5" font-weight="400" fill="#7a5b00" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">（不投递、可撤回；恢复时</text><text x="545" y="256.14" font-size="11.5" font-weight="400" fill="#7a5b00" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">逐条重评 OR，仍压着的不投）</text><line x1="538" y1="156" x2="538" y2="198" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-b)"/><text x="548" y="190" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">被暂停</text><line x1="670" y1="236" x2="700" y2="160" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah-b)"/><text x="20" y="300" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">实线＝正常路径；橙色＝被暂停时的落盘分支（不是「不可达」，也不许悄悄换人顶上）。</text><text x="20" y="320" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">四级顺序：域 → 主（单会话）→ 项目 → 全局；发送端与接收端都查。</text></svg>