<svg viewBox="0 0 900 668" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto"><defs><marker id="ah-a3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker></defs><rect x="150" y="14" width="600" height="60" rx="9" fill="#fff8e5" stroke="#bf8700" stroke-width="1.2"/><text x="450" y="39.32" font-size="12" font-weight="400" fill="#7a5b00" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">人 —— 最高权限</text><text x="450" y="57.32" font-size="12" font-weight="400" fill="#7a5b00" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">① 开关任何窗口　② 可否决立域／交接　③ 可直接下指令（优先）</text><polyline points="450,74 450,86" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-a3)"/><text x="20" y="104" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">体系层</text><rect x="300" y="90" width="300" height="56" rx="8" fill="#e8f1fd" stroke="#0969da" stroke-width="1.2"/><text x="450" y="114.392" font-size="12.2" font-weight="400" fill="#0969da" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">体系主会话</text><text x="450" y="130.392" font-size="12.2" font-weight="400" fill="#0969da" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">统筹多项目（按需：可不设）</text><text x="20" y="172" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">项目层</text><rect x="170" y="158" width="250" height="56" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="295" y="182.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">项目 A</text><text x="295" y="198.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">主会话（载体 · 可换届／交接）</text><rect x="480" y="158" width="250" height="56" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="605" y="182.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">项目 B</text><text x="605" y="198.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">主会话（载体 · 可换届／交接）</text><polyline points="450,146 450,152 295,152 295,156" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-a3)"/><polyline points="450,146 450,152 605,152 605,156" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-a3)"/><text x="20" y="250" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">域层</text><rect x="100" y="234" width="150" height="54" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="175" y="257.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">域①</text><text x="175" y="273.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">域会话（负责人）</text><rect x="270" y="234" width="150" height="54" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="345" y="257.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">域②</text><text x="345" y="273.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">域会话（负责人）</text><rect x="470" y="234" width="150" height="54" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="545" y="257.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">域③</text><text x="545" y="273.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">域会话（负责人）</text><rect x="640" y="234" width="150" height="54" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/><text x="715" y="257.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">域④</text><text x="715" y="273.176" font-size="11.6" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">域会话（负责人）</text><polyline points="295,214 295,224 175,224 175,232" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-a3)"/><polyline points="295,214 295,224 345,224 345,232" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-a3)"/><polyline points="605,214 605,224 545,224 545,232" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-a3)"/><polyline points="605,214 605,224 715,224 715,232" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-a3)"/><polyline points="450,288 450,300" fill="none" stroke="#57606a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-a3)"/><rect x="20" y="302" width="860" height="38" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="450" y="325.104" font-size="11.4" font-weight="400" fill="#57606a" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">子代理 —— 临时工 · 不代表域 · 用完就散（随父会话结束消失，不能当负责人）</text><polyline points="450,340 450,352" fill="none" stroke="#57606a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-a3)"/><rect x="20" y="356" width="860" height="68" rx="8" fill="#e8f1fd" stroke="#0969da" stroke-width="1.2"/><text x="450" y="386.32" font-size="12" font-weight="400" fill="#0969da" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">索引 · 交接包 · 域名册 · 域桥（11 工具）· 待办真值 · 文档渲染器</text><text x="450" y="402.32" font-size="12" font-weight="400" fill="#0969da" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">机制与工具 —— 必需（不是可选项；每个项目、每个域都要用）</text><rect x="20" y="434" width="860" height="36" rx="6" fill="#f3f4f6" stroke="#b9c0c8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="450" y="456.032" font-size="11.2" font-weight="400" fill="#57606a" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">dsh 宿主：会话生命周期 / 权限 / 面板 slot / 模型路由 —— 归 dsh，我们不重造（P8）</text><text x="20" y="492" font-size="11.5" font-weight="600" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">生命周期</text><rect x="110" y="478" width="180" height="46" rx="6" fill="#eaf7ee" stroke="#0a7b34" stroke-width="1.2"/><text x="200" y="496.96" font-size="11" font-weight="400" fill="#0a7b34" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">在线</text><text x="200" y="512.96" font-size="11" font-weight="400" fill="#0a7b34" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">有负责人且在岗，可投递</text><rect x="370" y="478" width="180" height="46" rx="6" fill="#fff8e5" stroke="#bf8700" stroke-width="1.2"/><text x="460" y="496.96" font-size="11" font-weight="400" fill="#7a5b00" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">离线</text><text x="460" y="512.96" font-size="11" font-weight="400" fill="#7a5b00" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">载体没了、域还在，报「不可达」</text><rect x="630" y="478" width="180" height="46" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.2"/><text x="720" y="496.96" font-size="11" font-weight="400" fill="#b42318" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">终结</text><text x="720" y="512.96" font-size="11" font-weight="400" fill="#b42318" text-anchor="middle" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">该域以后不做了（留墓碑）</text><polyline points="292,501 366,501" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-a3)"/><polyline points="552,501 626,501" fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ah-a3)"/><text x="20" y="556" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">图例：橙＝人的权限；蓝＝体系与机制；灰虚线＝dsh 的职责；细虚线箭头＝人事权授权／临时工；实线＝统筹与派生。</text><text x="20" y="582" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">不变量 ①：一个域只有一个负责人——同域多在线是违规状态，报警，不「挑一个投」。</text><text x="20" y="604" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">不变量 ②：域会话必须是顶层会话，不能是子代理（红线）；判据是「顶层还是子代理」，不是「谁开的」。</text><text x="20" y="626" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">不变量 ③：交接＝负责人变更，需公告，含未决事项／对外承诺／在途消息；身份随域跨窗口存续，载体可换。</text><text x="20" y="652" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif">两层同构：项目 : 主会话 ＝ 域 : 域会话。域是身份，会话只是载体。</text></svg>